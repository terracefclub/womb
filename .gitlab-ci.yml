workflow:
  rules:
    - when: never

membership-contract:
  image: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
  script:
    - python -m pip install --disable-pip-version-check --requirement windmill/f/Membership/merge_records_to_google_sheet.script.lock
    - python -m unittest discover -s tests/membership -v

check-supervision:
  image: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
  script:
    - python platform/test-run-check.py -v
    - python tests/platform/test_windmill_diagnostics.py -v
    - python -m unittest discover -s tests/platform -p 'test_vaultwarden_*.py' -v
    - python tests/platform/test_windmill_functional.py -v
    - python tests/platform/test_windmill_recovery.py -v
    - python platform/rehearsal/test-host.py -v
    - python -m unittest discover -s tests/platform -p 'test_documenso_*.py' -v
    - python platform/rehearsal/test-full.py -v
    - python tests/platform/test_bootstrap_identity.py -v
    - python tests/platform/test_pg_sample.py -v
    - python tests/platform/test_full_concurrent.py -v
    - python platform/full/test_restore_evidence.py -v
    - python tests/platform/test_restore_disk.py -v
    - python infra/cloud/test_preview.py -v

oci-metadata:
  image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
  script:
    - bun test tests/platform/oci-image.test.ts tests/platform/windmill-policy.test.ts
    - bun test tests/platform/fixture-clients.test.ts
    - bun test tests/platform/full-clients.test.ts
    - bun test tests/platform/windmill-functional.test.ts
    - bun test tests/platform/windmill-wheels.test.ts

documenso-contract:
  image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
  script:
    - bun test tests/platform/documenso-inputs.test.ts tests/platform/documenso-signing.test.ts

vaultwarden-contract:
  image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
  script:
    - bun test tests/platform/vaultwarden-policy.test.ts tests/platform/vaultwarden-runtime.test.ts
